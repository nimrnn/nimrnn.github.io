<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Article Search</title>
  <link rel="stylesheet" href="styles.css">
  <script src="vendor/fuse.min.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <h1 class="site-title">All on Cloud Hacking</h1>
    <div class="controls">
      <div class="search-field">
        <input id="search" type="search" placeholder="Search articles" aria-label="Search articles" autocomplete="off" autofocus>
        <button id="surprise" type="button" aria-label="Surprise me" title="Surprise me">
          <img src="assets/icons/dice-cube.png" alt="" aria-hidden="true">
        </button>
      </div>
    </div>
    <ul id="results"></ul>
    <button id="show-more" type="button" hidden>Show more</button>
  </main>
</body>
</html>
